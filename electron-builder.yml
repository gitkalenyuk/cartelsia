appId: com.cartelsia.app
productName: Cartelsia
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - node_modules/playwright
  - node_modules/playwright-core
  - node_modules/**/playwright
  - node_modules/**/playwright-core
npmRebuild: false
win:
  target: portable
  icon: build/icon.png
portable:
  artifactName: ${productName}-${version}-portable.exe
electronLanguages:
  - uk
  - en-US
